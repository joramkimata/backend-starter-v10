# version: '3'

services:
  db:
    # restart: always
    image: postgres:15.2
    ports:
      - '5235:5432'
    environment:
      - POSTGRES_PASSWORD=docker
      - POSTGRES_USER=postgres
      - POSTGRES_DB=rms
    volumes:
      - pg_data_rms:/var/lib/postgres/data
    networks:
      - rms
  pgAdmin:
    # restart: always
    image: dpage/pgadmin4:7.4
    ports:
      - '7089:80'
    environment:
      - PGADMIN_DEFAULT_EMAIL=dev@docker.org
      - PGADMIN_DEFAULT_PASSWORD=docker
    volumes:
      - pg_admin_rms:/var/lib/pgadmin
    networks:
      - rms
  api:
    # restart: always
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - 7080:7080
    environment:
      - CONNECTION_TYPE=postgres
      - DB_HOST=db
      - DB_PORT=5432
      - DB_POSTGRES_USER=postgres
      - DB_PASSWORD=docker
      - DB_NAME=rms
      - DB_SYNCHRONIZE=false
      - DB_PREFIX=budget
      - SECURITY_KEY=qwerty2024
      - REFRESH_TOKEN_EXPIRES_IN=1d
      - PORT=3000
    #      - EMAIL_HOST=smtp.cloudmta.net
    #      - EMAIL_USER=f9848c506dea731b
    #      - EMAIL_PASSWORD=cDqTJCxV4xEaBNsQ6h1p1bbx
    #      - EMAIL_PORT=587
    #      - EMAIL_FROM='Izweb Academy<no-reply@izwebacademy.com>'
    #      - IGNORE_ENV_FILE=true
    #      - EMAIL_LOGGER=false
    volumes:
      - .:/app
    depends_on:
      - db
    networks:
      - rms

networks:
  rms:


volumes:
  pg_data_rms:
  pg_admin_rms:
